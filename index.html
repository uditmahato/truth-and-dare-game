<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin the Wheel - Truth & Dare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif; /* A common Tailwind font */
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin 3s linear infinite;
    }
    /* Custom styles for the wheel pointer and player highlighting */
    .player-highlight-cycle {
      transition: background-color 0.1s ease-in-out, transform 0.1s ease-in-out;
    }
    .text-pop-shadow {
      /* Creates a slightly offset shadow for definition and a softer blur for pop */
      text-shadow: 1px 1px 0px rgba(0,0,0,0.4), 0px 0px 5px rgba(0,0,0,0.5);
    }
  </style>
